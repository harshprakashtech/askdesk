[project]
name = "askdesk-backend"
version = "0.1.0"
description = "This is the backend application for AskDesk, a multi-tenant FAQ and support chatbot platform."
requires-python = ">=3.10"

[tool.ruff]
# Set the maximum line length to 88 (Black's default)
line-length = 88
# Assume Python 3.10+
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E, W), and isort (I)
select = ["E", "F", "W", "I"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
